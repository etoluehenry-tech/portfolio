<!DOCTYPE html>

<head>

    <link rel="stylesheet" href="./contact.css" type="text/css" media="all">

                    <a href="contact.html" class="active">

                </li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <h1>Get In Touch</h1>
            <p>Have a question or want to work together? Feel free to reach out. I'd love to hear from you!</p>

            <form class="contact-form" action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>

                <button type="submit" class="btn contact-submit">Send Message</button>
            </form>

            <div class="contact-info-box">
                <div class="contact-info-item">
                    <i class="ri-mail-line"></i>
                    <h3>Email</h3>
                    <a href="mailto:etoluehenry@gmail.com">etoluehenry@gmail.com</a>
                </div>
                <div class="contact-info-item">
                    <i class="ri-phone-line"></i>
                    <h3>Phone</h3>
                    <a href="tel:+2347051138779">+234 705 113 8779</a>
                </div>
            </div>

            <div class="social-links">
                <a href="https://github.com/etoluehenry-tech" target="_blank" rel="noopener" title="GitHub">
                    <i class="ri-github-fill"></i>
                </a>
                <a href="https://twitter.com/etoluehenry" target="_blank" rel="noopener" title="Twitter">
                    <i class="ri-twitter-fill"></i>
                </a>
                <a href="https://linkedin.com/in/etoluehenry" target="_blank" rel="noopener" title="LinkedIn">
                    <i class="ri-linkedin-fill"></i>
                </a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <a href="index.html">
                    HENRY
                </a>
            </div>
            <p>&copy; 2026 Etolue Henry. All rights reserved.</p>
        </div>
    </footer>

</body>

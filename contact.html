<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Etolue Henry</title>
    <link rel="stylesheet" href="./style.css" type="text/css" media="all">
    <link rel="stylesheet" href="./contact.css" type="text/css" media="all">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>

    <header>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html">
                    HENRY
                </a>
            </div>
            <ul class="nav-links">
                <li>
                    <a href="index.html">
                        Home
                    </a>
                </li>
                <li>
                    <a href="resume.html">
                        Resume
                    </a>
                </li>
                <li>
                    <a href="portfolio.html">
                        Portfolio
                    </a>
                </li>
                <li>
                    <a href="contact.html" class="active">
                        Contact
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <section class="contact-section">
        <div class="contact-container">
            <h1>Get In Touch</h1>
            <p>Have a question or want to work together? Feel free to reach out. I'd love to hear from you!</p>

            <form class="contact-form" action="https://formsubmit.co/etoluehenry@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New portfolio contact message">
                <input type="hidden" name="_template" value="table">
                <input type="hidden" name="_captcha" value="true">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>

                <div class="form-group">
                    <label for="subject">Phone Number</label>
                    <input type="text" id="subject" name="subject" required placeholder="+234-706-596-1367">
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required placeholder="Your message here..."></textarea>
                </div>

                <button type="submit" class="submit-btn">Send Message</button>
                <p class="form-status" aria-live="polite"></p>
            </form>

            <div class="social-links">
                <a href="https://github.com/etoluehenry-tech" target="_blank" rel="noopener" title="GitHub">
                    <i class="ri-github-fill"></i>
                </a>
                <a href="https://twitter.com/etoluehenry" target="_blank" rel="noopener" title="Twitter">
                    <i class="ri-twitter-fill"></i>
                </a>
                <a href="https://linkedin.com/in/etoluehenry" target="_blank" rel="noopener" title="LinkedIn">
                    <i class="ri-linkedin-fill"></i>
                </a>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-logo">
                <a href="index.html">
                    HENRY
                </a>
            </div>
            <p>&copy; 2026 Etolue Henry. All rights reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>

</body>

</html>
